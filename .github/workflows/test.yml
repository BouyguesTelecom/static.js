name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - run: npm run build:lib
      - run: npm run test:unit
        env:
          STATICJS_SKIP_LIB_BUILD: "1"

  integration:
    # Packs the library, installs it in fresh apps with npm and checks build/SSR/server/CLI.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.x", "22.x", "24.x"]
        vite: ["^6.0.0", "^7.0.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build:lib
      - run: npm run test:integration
        env:
          STATICJS_SKIP_LIB_BUILD: "1"
          STATICJS_TEST_VITE_VERSION: ${{ matrix.vite }}

  e2e:
    # Browser tests: pages, hydration, and fragments consumed by HTML (Caddy-like) and Vite hosts.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:lib
      - run: npm run test:e2e
        env:
          STATICJS_SKIP_LIB_BUILD: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
